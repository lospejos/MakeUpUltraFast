plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    runtimeOnly 'maven.modrinth:iris:1.11.7+26.3-fabric'
    runtimeOnly 'maven.modrinth:sodium:mc26.3-0.9.2-fabric'
}

fabricApi {
    configureTests {
        modId = 'shadertest'
        enableClientGameTests = true
        enableGameTests = false
        eula = true
        clearRunDirectory = false
    }
}

def runDir = layout.buildDirectory.dir('run/clientGameTest')

// Zip ../shaders -> packs/MakeUp.zip (zip root must contain shaders/)
tasks.register('packShaders', Zip) {
    from(file('../shaders')) { into 'shaders' }
    archiveFileName = 'MakeUp.zip'
    destinationDirectory = layout.buildDirectory.dir('packs')
}

// The run task wipes its run dir, so install the pack and select it in Iris right before launch
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    dependsOn 'packShaders'
    doFirst {
        def dir = runDir.get().asFile
        copy { from tasks.named('packShaders'); into new File(dir, 'shaderpacks') }
        def cfg = new File(dir, 'config/iris.properties')
        cfg.parentFile.mkdirs()
        copy { from 'refpacks'; into new File(dir, 'shaderpacks') }
        cfg.text = ['enableShaders=true', 'shaderPack=' + (findProperty('pack') ?: 'MakeUp.zip')].join(System.lineSeparator())
    }
}
